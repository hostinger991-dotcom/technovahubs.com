<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>technovahubs — Loading Technical Paper...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages & Static Hosts
      // Redirects 404 direct paths to SPA index.html with path preserved
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <style>
      body {
        margin: 0;
        background: #081c18;
        color: #ffd700;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255,215,0,0.2);
        border-top-color: #ffd700;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div style="font-size: 13px; letter-spacing: 1px;">LOADING TECHNOVAHUBS PAPER...</div>
  </body>
</html>
